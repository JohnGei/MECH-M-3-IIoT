[project]
name = "MECH-M-3-IIoT"
version = "0.1.0"
description = "Industrial Internet of Things (MECH-M-DUAL-3-IOT): Aufgabenstellung, Spezifikationen und Vorlagen"
authors = [
    {name = "jhumci", email = "julian.huber@mci.edu"},
    {name = "Christoph Egger"},
]
dependencies = ["quarto-cli>=1.5", "quartodoc>=0.11.1"]
requires-python = "==3.12.*"
readme = "README.md"
license = {text = "MIT"}


[tool.pdm]
distribution = false

[tool.pdm.scripts]
docs-build = {composite = ["quartodoc build", "quarto render"]}
docs-preview = {composite = ["quartodoc build", "quarto preview"]}
