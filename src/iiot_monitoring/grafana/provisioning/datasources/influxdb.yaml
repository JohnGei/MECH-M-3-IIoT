apiVersion: 1

# Bestehende Datenquelle vor dem Provisioning entfernen
deleteDatasources:
  - name: InfluxDB
    orgId: 1

datasources:
  - name: InfluxDB
    uid: bg42ge9d4f56ob
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    editable: true

    jsonData:
      version: Flux
      organization: $INFLUX_ORG
      defaultBucket: $INFLUX_BUCKET

    secureJsonData:
      token: $INFLUX_TOKEN