# credentials.example.toml
# ===================================================================
# Vorlage für die Zugangsdaten des Pico W.
#
# 1. Diese Datei auf das CIRCUITPY-Laufwerk kopieren.
# 2. Dort in credentials.toml umbenennen.
# 3. Platzhalter durch die echten Werte ersetzen.
#
# credentials.toml steht in der .gitignore und darf NIE committet werden.
# ===================================================================

# --- WLAN ---
# Nur 2,4 GHz und WPA2 mit Passwort (kein eduroam / WPA2-Enterprise).
# Haupt-WLAN (wird zuerst versucht)
wifi_ssid = "HIER_WLAN_NAME_EINTRAGEN"
wifi_password = "HIER_WLAN_PASSWORT_EINTRAGEN"

# Optionale Ausweich-WLANs: Ist das Haupt-WLAN nicht erreichbar, werden
# diese der Reihe nach versucht. Weitere mit _3, _4, ... ergänzen.
# Nicht benötigte Einträge einfach löschen.
wifi_ssid_2 = "HIER_AUSWEICH_WLAN_EINTRAGEN"
wifi_password_2 = "HIER_AUSWEICH_PASSWORT_EINTRAGEN"

# --- MQTT ---
mqtt_username = "bobm"
# Passwort wird in der Vorlesung bekanntgegeben.
mqtt_password = "HIER_MQTT_PASSWORT_EINTRAGEN"
