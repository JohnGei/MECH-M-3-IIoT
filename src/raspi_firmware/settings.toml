# settings.toml
# ===================================================================
# Allgemeine Einstellungen des Pico W (liegt im Git-Repository).
#
# Zugangsdaten (WLAN, MQTT-Passwort) stehen NICHT hier, sondern in
# credentials.toml. Vorlage dafür: credentials.example.toml
# ===================================================================

# --- Geräteeinstellungen ---
# Eindeutiger Name für diesen Sensor, wird in den MQTT-Nachrichten
# (sensor_id) und in GET /config bzw. GET /status verwendet.
device_id = "iot-gruppe-2"
names = "neubauer-gruenwald-werlberger"
location = "Maximilianstraße 13, Innsbruck"

# --- MQTT Broker ---
broker_address = "158.180.44.197"
broker_port = 1883

# Topics, Struktur siehe docs/iot-specs/conventions.md
telemetry_topic = "iiot/group/neubauer-gruenwald-werlberger/sensor/temperature/state"
status_topic = "iiot/group/neubauer-gruenwald-werlberger/status"

# --- Applikation ---
# Intervall in Sekunden, in dem gemessen und gesendet wird (Minimum 2).
reading_interval_seconds = 60

# Nicht verwendet: Statt eines DHT11 wird nach Absprache mit der
# LV-Leitung die interne CPU-Temperatur des Pico gemessen.
sensor_pin = 22
