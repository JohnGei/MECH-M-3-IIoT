lang: de

project:
  type: website
  title: "IIoT Environmental Monitoring"
  output-dir: _site

  render:
    - index.qmd
    - docs/architecture.qmd
    - docs/raspberry-pi.qmd
    - docs/monitoring-stack.qmd
  resources:
    - README.md
    - docs/iot-specs/asyncapi.yaml
    - docs/iot-specs/openapi.yaml
    - docs/iot-specs/conventions.md
    - src/raspi_firmware/code.py
    - src/raspi_firmware/settings.toml
    - src/raspi_firmware/credentials.example.toml
    - src/raspi_firmware/lib/toml.py
    - src/iiot_monitoring/docker-compose.yml
    - src/iiot_monitoring/mqtt_collector.py
    - src/iiot_monitoring/influx_writer.py
    - src/iiot_monitoring/grafana/provisioning/datasources/influxdb.yaml
    - src/iiot_monitoring/grafana/dashboards/sensor_data.json
    - tests/mock_device.py
    - tests/test_http_api.py

website:
  title: "IIoT Monitoring"
  reader-mode: true
  page-footer:
    left: "Industrial Internet of Things · Projektdokumentation"
    right: "Erstellt mit [Quarto](https://quarto.org/)"
  navbar:
    left:
      - href: docs/architecture.qmd
        text: Systemarchitektur
      - href: docs/raspberry-pi.qmd
        text: Raspberry Pi
      - href: docs/monitoring-stack.qmd
        text: Monitoring-Stack

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    respect-user-color-scheme: true
    toc: true

quartodoc:
  package: raspi_firmware.code
  source_dir: src
  dir: .quarto/reference
  dynamic: false
  parser: google
  renderer:
    style: markdown
    header_level: 3
  options:
    children: embedded
    include_private: true
    include_attributes: false
    member_order: source
    exclude:
      - _read_toml
      - _method_not_allowed
      - _handle_config_route
      - _handle_status_route
      - _handle_get_request
      - _handle_post_request
  sections:
    - title: Firmware-Klassen
      contents:
        - kind: page
          path: firmware-api
          flatten: true
          contents:
            - ConfigManager
            - NetworkManager
            - Sensor
            - MqttClient
            - WebServer
